
experiment_name: wav_baseline

data:
  dataset: USC-annot-16 # options: USC-annot-16 | USC-TIMIT
  root: data/USC-annot-16
  phonemic_table: data/Phonemic_Table.xlsx
  classification_task:  # manner | place | voicing | vowel_backness, set to "" or None for multi-task
  untrained_subjects: # list of subjects to hold out for testing
  untrained_tasks: # list of tasks to hold out for testing
  test_ratio: 0.1
  n_splits: 5
  fps: 15
  audio_sample_rate: 16000
  audio_window_sec: 0.33335 # before: 2frame + 1frame + after: 2frame = 5frame = 0.33335s
  seed: 42

model:
  image_encoder:
    img_size: 128
  audio_encoder:
    model_name: facebook/wav2vec2-large-xlsr-53
    freeze_feature_extractor: true
    freeze_transformer_layers: 6 # max: 12 for wav2vec2-base, 24 for wav2vec2-large
    attn_dim: 256
    clf_hidden_dim: 256
    dropout: 0.1
train:
  epochs: 5
  batch_size: 32
  num_workers: 4
  grad_clip: 0.5
  weight_decay: 0.01
  lr_encoder: 3.0e-5
  lr_pooling: 1.0e-4
  lr_classifier: 3.0e-4

loss:
  lambda_contrast: 0.0
  contrast_loss_name: null
  contrast_loss_kwargs: null
  use_class_weights: true
  bce_pos_weight: false
  lambda_manner: 1.0
  lambda_place: 1.0
  lambda_voicing: 1.0
  lambda_vowel_backness: 1.0

paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
